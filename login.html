<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Acesso adulto · PACUS</title>
<link rel="stylesheet" href="styles.css?v=20260823-3"><link rel="stylesheet" href="ui.css?v=20260823-2"><link rel="stylesheet" href="theme.css?v=20260821-3">
<style>
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(430px,100%);background:var(--panel,#fff);border-radius:20px;padding:28px;box-shadow:0 12px 40px #0002}.auth-card h1{margin:0 0 8px}.auth-card p{color:#666}.auth-field{display:grid;gap:6px;margin:14px 0}.auth-field input{padding:12px;border-radius:10px;border:1px solid #bbb;font-size:16px}.auth-actions{display:grid;gap:10px;margin-top:18px}.auth-actions button{padding:12px;border:0;border-radius:10px;cursor:pointer;font-weight:700}.auth-error{min-height:22px;color:#b42318}.auth-note{font-size:13px}.auth-switch{background:transparent!important}
</style></head>
<body class="adult-page"><main class="auth-shell"><section class="auth-card"><a class="adult-back" href="index.html">← Voltar</a><h1>🔒 Área dos Adultos</h1><p>Acesso protegido para configurar a rotina e consultar os registros.</p>
<form id="auth-form"><label class="auth-field"><span>E-mail</span><input id="email" type="email" autocomplete="email" required></label><label class="auth-field"><span>Senha</span><input id="password" type="password" autocomplete="current-password" minlength="8" required></label><label class="auth-field" id="name-field" hidden><span>Nome</span><input id="name" type="text" autocomplete="name"></label><div id="auth-error" class="auth-error" aria-live="polite"></div><div class="auth-actions"><button id="submit-btn" type="submit">Entrar</button><button id="switch-btn" class="auth-switch" type="button">Primeiro acesso? Criar conta adulta</button></div></form><p class="auth-note">A sessão fica protegida pelo Supabase Auth e pode ser reutilizada entre as páginas do PACUS. Os dados da rotina continuam fora do localStorage.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="auth.js?v=20260823-2"></script><script>
(() => { const form=document.getElementById('auth-form'), email=document.getElementById('email'), password=document.getElementById('password'), name=document.getElementById('name'), nameField=document.getElementById('name-field'), error=document.getElementById('auth-error'), submit=document.getElementById('submit-btn'), sw=document.getElementById('switch-btn'); let signup=false; const next=new URLSearchParams(location.search).get('next')||'adultos.html'; sw.onclick=()=>{signup=!signup;nameField.hidden=!signup;submit.textContent=signup?'Criar acesso':'Entrar';sw.textContent=signup?'Já tenho acesso. Entrar':'Primeiro acesso? Criar conta adulta';error.textContent='';}; form.onsubmit=async e=>{e.preventDefault();error.textContent='';submit.disabled=true;try{if(signup){const r=await PacusAuth.signUp(email.value.trim(),password.value,name.value.trim());if(!r.confirmed){error.textContent='Conta criada. Confirme seu e-mail e depois entre novamente.';return;}}else await PacusAuth.signIn(email.value.trim(),password.value);location.replace(next);}catch(err){error.textContent=err.message||'Não foi possível autenticar.';}finally{submit.disabled=false;}}; })();
</script></body></html>
