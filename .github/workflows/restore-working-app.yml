name: Restore working app

on:
  push:
    paths:
      - '.github/restore-working-app.trigger'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified application code
        run: |
          git checkout cc7de9f801269b0279723b041ede00643b76e98f -- app.js
          node --check app.js
      - name: Commit restored application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Restaurar app.js funcional após extração' || exit 0
          git push
