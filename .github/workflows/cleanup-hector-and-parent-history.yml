name: Limpar nome e mover histórico de hoje

on:
  push:
    branches: [main]
    paths:
      - ai-chunks/cleanup-hector-trigger.txt

permissions:
  contents: write

concurrency:
  group: cleanup-hector-and-parent-history
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limpar referências e restringir histórico
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'parent-history-only-v1'
          if marker in text:
              raise SystemExit('Ajuste já aplicado.')

          # Remove o nome da marca/textos/chaves do front-end.
          text = text.replace('Rotina do Hector — Pacus', 'Rotina do Pacus')
          text = re.sub(r'(?i)hector', 'rotina', text)
          text = text.replace('Rotina do Rotina', 'Rotina')

          css = '''\n/* parent-history-only-v1 */\n.today-history-parent-only{display:none!important;}\n.adult-history-card{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);}\n.adult-history-card .adult-history-title{font-family:"Segoe Print","Bradley Hand",cursive;color:var(--yellow);margin:0 0 8px;font-size:1rem;}\n'''
          text = text.replace('</style>', css + '\n</style>', 1)

          script = r'''\n<script>\n/* parent-history-only-v1: mantém o histórico de hoje fora do painel principal\n   e o injeta apenas dentro da Área dos Adultos. */\n(function(){\n  function norm(s){ return (s||'').replace(/\\s+/g,' ').trim(); }\n  function findTodayBlock(){\n    var all=[].slice.call(document.querySelectorAll('details,section,article,div'));\n    for(var i=0;i<all.length;i++){\n      var e=all[i];\n      if(norm(e.textContent).indexOf('Histórico de hoje')===0){\n        var parent=e.parentElement;\n        if(!parent || norm(parent.textContent).indexOf('Histórico de hoje')!==0) return e;\n      }\n    }\n    return null;\n  }\n  function findAdultHost(){\n    var all=[].slice.call(document.querySelectorAll('details,section,article,div,[role="dialog"]'));\n    for(var i=0;i<all.length;i++){\n      var t=norm(all[i].textContent);\n      if(t.indexOf('Área dos adultos')>=0 && t.length<1200) return all[i];\n    }\n    return null;\n  }\n  function move(){\n    var block=findTodayBlock();\n    if(!block) return false;\n    block.classList.add('today-history-parent-only');\n    block.setAttribute('aria-hidden','true');\n    var host=findAdultHost();\n    if(!host) return false;\n    var old=host.querySelector('.adult-history-card');\n    if(old) old.remove();\n    var card=document.createElement('div');\n    card.className='adult-history-card';\n    var title=document.createElement('div');\n    title.className='adult-history-title';\n    title.textContent='Histórico de hoje';\n    var clone=block.cloneNode(true);\n    clone.classList.remove('today-history-parent-only');\n    clone.removeAttribute('aria-hidden');\n    clone.querySelectorAll('[id]').forEach(function(n){ n.id='adult-'+n.id; });\n    card.appendChild(title);\n    card.appendChild(clone);\n    host.appendChild(card);\n    return true;\n  }\n  function boot(){\n    move();\n    var obs=new MutationObserver(function(){ move(); });\n    obs.observe(document.body,{childList:true,subtree:true});\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();\n})();\n</script>\n'''
          text = text.replace('</body>', script + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: remover nome antigo e restringir histórico aos adultos"
          git push
