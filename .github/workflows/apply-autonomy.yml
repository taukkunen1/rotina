name: Apply autonomy module

on:
  push:
    paths:
      - '.github/autonomy-apply.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert autonomy script safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./autonomy.js?v=20260821-1"></script>'
          if tag not in s:
              if s.count('</body>') != 1:
                  raise SystemExit('Expected exactly one </body> tag')
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          if tag not in p.read_text(encoding='utf-8'):
              raise SystemExit('Autonomy script insertion failed')
          PY
      - name: Commit application change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: enable autonomy module'
          git push
