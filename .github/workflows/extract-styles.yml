name: Extract CSS safely

on:
  push:
    branches: [main]
    paths: ['.github/workflows/extract-styles.yml']

permissions:
  contents: write

concurrency:
  group: extract-css-once
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract inline CSS without changing behavior
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          if 'href="styles.css"' in html:
              print('styles.css already linked; nothing to do')
              raise SystemExit(0)

          pattern = re.compile(r'<style\b[^>]*>(.*?)</style>', re.I | re.S)
          matches = list(pattern.finditer(html))
          if not matches:
              raise SystemExit('No inline <style> block found')

          css = '\n\n'.join(m.group(1).strip() for m in matches) + '\n'
          Path('styles.css').write_text(css, encoding='utf-8')

          first = matches[0]
          pieces = []
          last = 0
          for i, match in enumerate(matches):
              pieces.append(html[last:match.start()])
              if i == 0:
                  pieces.append('  <link rel="stylesheet" href="styles.css">')
              last = match.end()
          pieces.append(html[last:])
          new_html = ''.join(pieces)

          if '<style' in new_html.lower():
              raise SystemExit('Inline <style> remained after extraction')
          if len(css.strip()) < 1000:
              raise SystemExit('Extracted CSS unexpectedly small')
          if new_html.count('<script') != new_html.count('</script>'):
              raise SystemExit('Script tag balance changed unexpectedly')

          index.write_text(new_html, encoding='utf-8')
          print(f'Extracted {len(matches)} style block(s), {len(css)} CSS characters')

      - name: Validate extracted files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')
          assert 'href="styles.css"' in html
          assert '<style' not in html.lower()
          assert len(css) > 1000
          assert html.count('<script') == html.count('</script>')
          print('CSS extraction validation passed')
          PY

      - name: Commit stage 1
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "refactor: extract inline CSS to styles.css"
          git push
