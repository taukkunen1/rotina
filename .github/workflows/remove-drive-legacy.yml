name: Remove retired Drive runtime

on:
  push:
    branches: [refactor/remove-legacy-safe]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove Google Drive runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')

          s = re.sub(
              r'/\* Sincronização com Google Drive via Apps Script.*?const DATA_ENDPOINT = APPS_SCRIPT_URL \+ "\?data=1";\n',
              '/* Persistência remota: Supabase via RotinaStorage. */\n',
              s,
              flags=re.S,
          )

          s = re.sub(
              r'/\* ---------- sincronização automática com o Google Drive ----------.*?/\* ===================== BACKUP LOCAL',
              '/* Sincronização automática legada removida. O RotinaStorage agora usa Supabase. */\nfunction scheduleAutoPush(){}\n\n/* ===================== BACKUP LOCAL',
              s,
              flags=re.S,
          )

          s = s.replace('try{ autoPullOnStartup(); }catch(err){ showFatalErrorBanner(err); }', '')
          s = s.replace('try{ startPeriodicSync(); }catch(err){ /* sincronização periódica é só um extra, não crítica */ }', '')
          s = s.replace('try{\n  autoPullOnStartup();\n}catch(err){\n  showFatalErrorBanner(err);\n}\n', '')
          s = s.replace('try{\n  startPeriodicSync();\n}catch(err){ /* sincronização periódica é só um extra, não crítica */ }\n', '')

          p.write_text(s, encoding='utf-8')

          # Remove the one-off workflow after it has done its job.
          wf = Path('.github/workflows/remove-drive-legacy.yml')
          if wf.exists():
              wf.unlink()

      - name: Commit cleaned runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/remove-drive-legacy.yml
          git diff --cached --quiet || git commit -m "refactor: remove Google Drive runtime"
          git push