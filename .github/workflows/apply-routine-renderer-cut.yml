name: Apply routine renderer cut

on:
  push:
    branches:
      - refactor/frontend-tests-stage-5-4
    paths:
      - 'scripts/extract-routine-render-call.py'
      - '.github/workflows/apply-routine-renderer-cut.yml'

permissions:
  contents: write

jobs:
  apply-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-tests-stage-5-4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace legacy render block
        run: python scripts/extract-routine-render-call.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No migration needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'refactor: delegate period rendering to routine renderer'
          git push origin HEAD:refactor/frontend-tests-stage-5-4
