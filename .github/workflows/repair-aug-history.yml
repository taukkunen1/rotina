name: Reparar histórico e crescimento do PACUS

on:
  push:
    branches: [main]
    paths:
      - ai-chunks/**

permissions:
  contents: write

concurrency:
  group: rotina-data-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correções de agosto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          if 'state.backfillGapDaysV2Applied' not in text:
              anchor = '''    state.backfillGapDaysV1Applied = true;
  }
  if(!state.gameTimer || typeof state.gameTimer !== "object"){'''
              patch = '''    state.backfillGapDaysV1Applied = true;
  }
  if(!state.backfillGapDaysV2Applied){
    ["2026-08-15","2026-08-16","2026-08-17","2026-08-18","2026-08-19","2026-08-20"].forEach(iso=>{
      const tasks = allTasks(iso);
      const total = tasks.length;
      const pointsEarnedThatDay = tasks.reduce((sum, task)=>sum + (Number(task.pts)||0), 0);
      const previous = state.history[iso] || {};
      state.history[iso] = {
        ...previous,
        done: total,
        total,
        pointsEarnedThatDay,
        perfect: total > 0,
        screenMinutes: total > 0 ? (CONFIG.perfectDayBonusMinutes || 30) : 0,
        periodsCompleted: 3,
        hair: (state.hairByDate && state.hairByDate[iso]) || previous.hair || null,
      };
      if(total > 0) registerPetDayCompletion(iso);
    });
    state.backfillGapDaysV2Applied = true;
  }
  if(!state.gameTimer || typeof state.gameTimer !== "object"){'''
              if anchor not in text:
                  raise SystemExit('Âncora do histórico não encontrada.')
              text = text.replace(anchor, patch, 1)

          old = '''  if(!state.growthMatchCalendarDayV1Applied){
    // Correção pedida: crescimento alinhado ao dia do calendário — 9/08
    // é o dia 0, hoje (21/08) é o dia 12 do ciclo de 23. Esse é um ajuste
    // intencional dos pais, então força o valor (não é regressão real).
    state.petMaxDaysEquivalentEverSeen = 12;
    state.growthMatchCalendarDayV1Applied = true;
  }
'''
          new = '''  // Calendário real do PACUS:
  // 09/08 a 20/08 = tamanho Bebê fixo.
  // 21/08 a 31/08 = crescimento linear até Adulto completo.
  // O progresso visual é baseado no calendário, não na contagem antiga de 23 dias.
  CONFIG.pet = CONFIG.pet || {};
  CONFIG.pet.growthStartDate = "2026-08-09";
  CONFIG.pet.growthEndDate = "2026-08-31";
  CONFIG.pet.babyUntilDate = "2026-08-20";
  CONFIG.pet.adultStartDate = "2026-08-21";
  CONFIG.pet.growthDays = 11;
  if(!state.growthMatchCalendarDayV2Applied){
    // Hoje (21/08) deve continuar no tamanho Bebê. O primeiro incremento
    // acontece a partir de 22/08 e 31/08 representa 100% Adulto.
    state.petMaxDaysEquivalentEverSeen = 0;
    state.growthMatchCalendarDayV2Applied = true;
  }
'''
          if 'state.growthMatchCalendarDayV2Applied' not in text:
              if old not in text:
                  raise SystemExit('Âncora do crescimento do PACUS não encontrada.')
              text = text.replace(old, new, 1)

          # Injeta uma função canônica de progresso por data antes do registro de conclusão.
          marker = 'function registerPetDayCompletion(dateISO){'
          helper = '''function getPacusCalendarGrowth(dateISO){
  const iso = dateISO || todayISO();
  const babyUntil = "2026-08-20";
  const adultStart = "2026-08-21";
  const adultEnd = "2026-08-31";
  if(iso <= babyUntil) return 0;
  if(iso >= adultEnd) return 1;
  const start = new Date(adultStart + "T00:00:00");
  const end = new Date(adultEnd + "T00:00:00");
  const current = new Date(iso + "T00:00:00");
  return Math.max(0, Math.min(1, (current - start) / (end - start)));
}

'''
          if 'function getPacusCalendarGrowth(dateISO)' not in text:
              if marker not in text:
                  raise SystemExit('Ponto de inserção do progresso não encontrado.')
              text = text.replace(marker, helper + marker, 1)

          p.write_text(text, encoding='utf-8')
          print('Correções aplicadas.')
          PY
      - name: Commitar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: alinhar crescimento do PACUS de 9 a 31 de agosto"
          git push
