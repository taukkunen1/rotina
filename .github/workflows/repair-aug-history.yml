name: Reparar histórico de agosto

on:
  push:
    branches: [main]
    paths:
      - ai-chunks/0024.txt

permissions:
  contents: write

concurrency:
  group: repair-aug-history
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar reparo no histórico 15-20/08
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'state.backfillGapDaysV2Applied'
          if marker in text:
              print('Reparo já aplicado.')
              raise SystemExit(0)
          anchor = '''    state.backfillGapDaysV1Applied = true;
  }
  if(!state.gameTimer || typeof state.gameTimer !== "object"){'''
          patch = '''    state.backfillGapDaysV1Applied = true;
  }
  // 15 a 20/08 foram concluídos, mas uma migração de armazenamento deixou
  // o histórico incompleto/zerado. Reconstituímos os totais pela rotina
  // correspondente a cada data e marcamos esses dias como perfeitos.
  if(!state.backfillGapDaysV2Applied){
    ["2026-08-15","2026-08-16","2026-08-17","2026-08-18","2026-08-19","2026-08-20"].forEach(iso=>{
      const tasks = allTasks(iso);
      const total = tasks.length;
      const pointsEarnedThatDay = tasks.reduce((sum, task)=>sum + (Number(task.pts)||0), 0);
      const previous = state.history[iso] || {};
      state.history[iso] = {
        ...previous,
        done: total,
        total,
        pointsEarnedThatDay,
        perfect: total > 0,
        screenMinutes: total > 0 ? (CONFIG.perfectDayBonusMinutes || 30) : 0,
        periodsCompleted: 3,
        hair: (state.hairByDate && state.hairByDate[iso]) || previous.hair || null,
      };
      if(total > 0) registerPetDayCompletion(iso);
    });
    state.backfillGapDaysV2Applied = true;
  }
  if(!state.gameTimer || typeof state.gameTimer !== "object"){'''
          if anchor not in text:
              raise SystemExit('Âncora do reparo não encontrada no index.html.')
          p.write_text(text.replace(anchor, patch, 1), encoding='utf-8')
          print('Histórico 15-20/08 reparado.')
          PY
      - name: Commitar reparo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: preencher histórico concluído de 15 a 20 de agosto"
          git push
