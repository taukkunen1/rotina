name: Limpar seções e compactar timer

on:
  push:
    branches: [main]
    paths:
      - ai-chunks/cleanup-sections-and-mini-timer.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover seções e criar mini timer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove blocos colapsáveis inteiros pelo título visível.
          # A repetição é proposital: alguns blocos podem ter detalhes internos.
          for label in ['Vi algo legal!', 'Mural de Conquistas do Pacus']:
              pattern = re.compile(
                  r'<details\\b[^>]*class="[^"]*block-collapsible[^"]*"[^>]*>.*?<summary[^>]*>.*?'
                  + re.escape(label) +
                  r'.*?</summary>.*?</details>',
                  re.I | re.S
              )
              s, _ = pattern.subn('', s)

          # Remove variações sem a classe, caso uma versão antiga tenha permanecido.
          for label in ['Vi algo legal!', 'Mural de Conquistas do Pacus']:
              pattern = re.compile(
                  r'<details\\b[^>]*>.*?<summary[^>]*>.*?'
                  + re.escape(label) +
                  r'.*?</summary>.*?</details>',
                  re.I | re.S
              )
              s, _ = pattern.subn('', s)

          # CSS do mini timer fixo, discreto e sempre acessível.
          css = r'''
  /* Mini timer: compacto, sem ocupar uma seção inteira. */
  .mini-site-timer{
    position:fixed;
    right:14px;
    bottom:88px;
    z-index:82;
    display:flex;
    align-items:center;
    gap:7px;
    min-width:116px;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(14,23,18,.94);
    box-shadow:0 8px 22px rgba(0,0,0,.35);
    backdrop-filter:blur(5px);
    font-size:.72rem;
    color:var(--chalk-dim);
  }
  .mini-site-timer .mini-timer-time{
    color:var(--blue);
    font-weight:bold;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .mini-site-timer .mini-timer-label{
    max-width:92px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  @media (max-width:640px){
    .mini-site-timer{ right:10px; bottom:82px; min-width:0; }
    .mini-site-timer .mini-timer-label{ display:none; }
  }
'''
          if '/* Mini timer: compacto, sem ocupar uma seção inteira. */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          # Injeta o mini timer no body e atualiza a cada segundo.
          html = r'''
  <div class="mini-site-timer" id="miniSiteTimer" aria-live="polite" title="Tempo restante do período atual">
    <span>⏱</span>
    <span class="mini-timer-time" id="miniTimerTime">--:--</span>
    <span class="mini-timer-label" id="miniTimerLabel">Timer</span>
  </div>
'''
          if 'id="miniSiteTimer"' not in s:
              s = s.replace('<body>', '<body>\n' + html, 1)

          js = r'''
// Mini timer global: mostra o período atual e o tempo restante, sem seção dedicada.
function updateMiniSiteTimer(){
  const timeEl = document.getElementById('miniTimerTime');
  const labelEl = document.getElementById('miniTimerLabel');
  if(!timeEl || !labelEl) return;
  const cfg = (typeof config !== 'undefined' && config) ? config : null;
  const periods = cfg && cfg.periods ? cfg.periods : null;
  if(!periods){ timeEl.textContent = '--:--'; labelEl.textContent = 'Timer'; return; }
  const now = new Date();
  const defs = Object.entries(periods).map(([key, p])=>({ key, p, start: typeof periodStartTime==='function' ? periodStartTime(p.time||'') : null, end: typeof periodEndTime==='function' ? periodEndTime(p.time||'') : null }));
  let active = defs.find(x=>x.start && x.end && (now.getHours()*60+now.getMinutes()) >= x.start.hour*60+x.start.minute && (now.getHours()*60+now.getMinutes()) <= x.end.hour*60+x.end.minute);
  if(!active){
    const next = defs.find(x=>x.start && (now.getHours()*60+now.getMinutes()) < x.start.hour*60+x.start.minute);
    if(next){ timeEl.textContent = '→'; labelEl.textContent = `começa ${next.p.label||next.key} ${String(next.start.hour).padStart(2,'0')}:${String(next.start.minute).padStart(2,'0')}`; }
    else { timeEl.textContent = '✓'; labelEl.textContent = 'dia encerrado'; }
    return;
  }
  const end = new Date(now); end.setHours(active.end.hour, active.end.minute, 0, 0);
  const sec = Math.max(0, Math.ceil((end-now)/1000));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), ss = sec%60;
  timeEl.textContent = h ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${m}:${String(ss).padStart(2,'0')}`;
  labelEl.textContent = active.p.label || active.key;
}
'''
          if '// Mini timer global: mostra o período atual' not in s:
              s = s.replace('</script>', js + '\n</script>', 1)

          # Inicia depois do carregamento para não depender da ordem dos scripts.
          boot = """
window.addEventListener('load', function(){
  updateMiniSiteTimer();
  setInterval(updateMiniSiteTimer, 1000);
});
"""
          if 'setInterval(updateMiniSiteTimer, 1000)' not in s:
              s = s.replace('</body>', '<script>' + boot + '</script>\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: remover seções e compactar timer"
          git push
