name: Fix index bootstrap

on:
  push:
    branches:
      - fix/main-runtime-duplicate-bootstrap
      - refactor/remove-legacy-safe
    paths:
      - 'scripts/fix-index-duplicate-bootstrap.py'
      - '.github/workflows/fix-index-bootstrap.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix-index-duplicate-bootstrap.py
      - name: Commit repaired index
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove duplicate app bootstrap'
          git push origin HEAD:${{ github.ref_name }}
