name: Repair index now

on:
  push:
    branches:
      - refactor/remove-legacy-safe

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-safe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix-index-duplicate-bootstrap.py
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: repair duplicate index bootstrap'
          git push origin HEAD:refactor/remove-legacy-safe
