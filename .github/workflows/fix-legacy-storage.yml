name: Fix legacy local storage

on:
  push:
    paths:
      - '.github/workflows/fix-legacy-storage.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject legacy storage migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<meta http-equiv="Expires" content="0">'
          snippet = '''<meta name="rotina-app-version" content="2026-08-21-storage-fix">
<script>
(function(){
  var migrationKey = 'hector_rotina_remote_storage_migrated_v1';
  try {
    if (localStorage.getItem(migrationKey) !== 'done') {
      ['hector_rotina_config_v3','hector_rotina_state_v3'].forEach(function(key){
        localStorage.removeItem(key);
      });
      localStorage.setItem(migrationKey, 'done');
    }
  } catch (e) {
    console.warn('Legacy storage cleanup skipped', e);
  }
})();
</script>'''
          if 'hector_rotina_remote_storage_migrated_v1' not in s:
            s = s.replace(marker, marker + '\n' + snippet, 1)
            p.write_text(s, encoding='utf-8')
          PY
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: clear incompatible legacy local storage"
          git push