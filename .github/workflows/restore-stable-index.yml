name: Restore stable index safely
on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-chunks/restore-stable-index.trigger'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last stable UI before naming cleanup
        run: |
          git show 3886216e1747e32c47835ae7cbea03cf18079288:index.html > index.html
      - name: Apply safe presentation-only cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Only visible labels are renamed. Storage keys and compatibility code stay untouched.
          s = s.replace('<title>Rotina do Hector — Pacus</title>', '<title>Rotina do Pacus</title>')
          s = s.replace('<h1>🥚 Rotina do Hector</h1>', '<h1>🥚 Rotina do Pacus</h1>')
          s = s.replace('Rotina do Hector · ${APP_VERSION}', 'Rotina do Pacus · ${APP_VERSION}')
          # Remove only literal legacy section headings if present; do not alter scripts or state.
          for label in ['🌟 Vi algo legal!', '🏆 Mural de Conquistas do Pacus']:
              s = s.replace('<summary>'+label+' <span class="chev">▾</span></summary>', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate HTML and JavaScript delimiters
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '\\n<script>' not in s
          assert s.count('<script') == s.count('</script>'), (s.count('<script'), s.count('</script>'))
          assert s.count('<style') == s.count('</style>'), (s.count('<style'), s.count('</style>'))
          assert '${APP_VERSION}' not in s
          assert 'Rotina do rotina' not in s
          print('validation ok')
          PY
      - name: Commit restored UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: restore stable UI and safe app naming'
          git push
