name: Restore stable index safely
on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-chunks/restore-stable-index.trigger'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good UI
        run: |
          git show df6254b3360a097119b88873fad57c21daa633b7:index.html > index.html
      - name: Apply visible naming only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>Rotina do Hector — Pacus</title>', '<title>Rotina do Pacus</title>')
          s = s.replace('<h1>🥚 Rotina do Hector</h1>', '<h1>🥚 Rotina do Pacus</h1>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate restored file
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '\\n<script>' not in s
          assert s.count('<script') == s.count('</script>'), (s.count('<script'), s.count('</script>'))
          assert s.count('<style') == s.count('</style>'), (s.count('<style'), s.count('</style>'))
          assert 'Rotina do rotina' not in s
          print('validation ok')
          PY
      - name: Commit restored UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: restore known-good UI'
          git push
