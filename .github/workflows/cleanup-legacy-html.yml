name: Cleanup legacy main HTML

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/cleanup-legacy-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: "!startsWith(github.event.head_commit.message, 'chore: remove legacy main UI')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy main-page markup safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          original=s

          patterns=[
            r'\n\s*<details class="block-collapsible">\s*<summary>⏱️ Timers</summary>.*?</details>',
            r'\n\s*<details class="block-collapsible">\s*<summary>🌟 Vi algo legal!</summary>.*?</details>',
            r'\n\s*<details class="block-collapsible">\s*<summary>📝 Histórico de hoje</summary>.*?</details>',
            r'\n\s*<details class="block-collapsible">\s*<summary>🏆 Mural de Conquistas do Pacus</summary>.*?</details>',
            r'\n\s*<details class="block-collapsible">\s*<summary>📅 Histórico dos dias</summary>.*?</details>',
            r'\n\s*<section class="block" id="driveSyncSection"></section>',
            r'\n\s*<footer>.*?</footer>',
            r'\n<!-- ===================== MODAL DE EDIÇÃO DE DIA ANTERIOR ===================== -->.*?</div>\s*\n\s*<!-- ===================== MODAL DE EDIÇÃO ===================== -->'
          ]
          for pat in patterns:
            ns,n=re.subn(pat,'',s,count=1,flags=re.S)
            if n!=1:
              raise SystemExit(f'Expected exactly one legacy block for pattern: {pat[:70]}')
            s=ns

          # Minimal hidden compatibility mounts for code still being untangled.
          marker='    <div class="content">'
          mounts='''    <div id="legacyRuntimeMounts" hidden aria-hidden="true">\n      <div id="customTimersSection"></div>\n      <div id="positiveBehaviors"></div>\n      <div id="logList"></div>\n      <div id="achievementMuralSection"></div>\n      <div id="historyTable"><div id="historyBody"></div></div>\n      <div id="historyToggle"></div>\n      <div id="driveSyncSection"></div>\n      <button id="exportBtn" type="button"></button>\n      <button id="importBtn" type="button"></button>\n      <input id="importFile" type="file">\n      <button id="resetBtn" type="button"></button>\n      <div id="backupReminder"></div>\n    </div>\n\n'''
          if marker not in s: raise SystemExit('Content marker not found')
          s=s.replace(marker,mounts+marker,1)
          if s==original: raise SystemExit('No changes made')
          p.write_text(s)
          PY
      - name: Validate HTML and JavaScript syntax
        run: |
          node --check app.js
          node --check storage.js
          node --check autonomy.js
          node --check app-ui.js
          test -f adultos.html
          test -f historico.html
          ! grep -q '<summary>🌟 Vi algo legal!' index.html
          ! grep -q '<summary>📝 Histórico de hoje' index.html
          ! grep -q '<summary>🏆 Mural de Conquistas do Pacus' index.html
          ! grep -q '<summary>📅 Histórico dos dias' index.html
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: remove legacy main UI'
          git push
