name: Link storage module safely

on:
  push:
    branches: [main]
    paths: ['storage.js', '.github/workflows/link-storage-module.yml']

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link storage module before application scripts
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="storage.js"></script>'
          if tag not in s:
              marker = '<head>'
              if marker not in s:
                  raise SystemExit('Missing <head>')
              s = s.replace(marker, marker + '\n' + tag, 1)
              p.write_text(s, encoding='utf-8')
        
      - name: Validate JavaScript modules
        run: |
          node --check storage.js
          node --check autonomy.js
          node --check app-ui.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<script src="storage.js"></script>' in html
          assert 'href="styles.css"' in html
          assert html.count('<script') == html.count('</script>')
          print('Storage link validation passed')
          PY

      - name: Commit stage 2
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: load storage module"
          git push
