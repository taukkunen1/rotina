const fs = require("fs");
const path = require("path");

const file = path.join(__dirname, "..", "index.html");

function fail(message) {
  console.error(`ERRO: ${message}`);
  process.exit(1);
}

function getEnv(name) {
  return process.env[name] ?? "";
}

function applyPatch() {
  const oldText = getEnv("PATCH_OLD");
  const newText = getEnv("PATCH_NEW");

  if (!oldText) {
    fail("PATCH_OLD não foi informado.");
  }

  if (!newText) {
    fail("PATCH_NEW não foi informado.");
  }

  if (!fs.existsSync(file)) {
    fail("index.html não foi encontrado.");
  }

  const source = fs.readFileSync(file, "utf8");

  if (!source.trim()) {
    fail("index.html está vazio.");
  }

  if (!source.startsWith("<!DOCTYPE html>")) {
    fail("index.html não começa com <!DOCTYPE html>.");
  }

  const occurrences = source.split(oldText).length - 1;

  if (occurrences === 0) {
    fail(
      "O trecho antigo não foi encontrado. " +
      "Nenhuma alteração foi feita."
    );
  }

  if (occurrences > 1) {
    fail(
      `O trecho antigo aparece ${occurrences} vezes. ` +
      "Patch cancelado para evitar alterar o local errado."
    );
  }

  const updated = source.replace(oldText, newText);

  if (updated === source) {
    fail("O arquivo não sofreu nenhuma alteração.");
  }

  if (!updated.startsWith("<!DOCTYPE html>")) {
    fail("O resultado deixou de ser um HTML válido.");
  }

  if (!updated.includes("</html>")) {
    fail("O resultado não contém </html>.");
  }

  /*
   * Backup local da versão anterior.
   * O backup não é adicionado ao commit pelo workflow.
   */
  const backup = `${file}.backup`;

  fs.writeFileSync(backup, source, "utf8");
  fs.writeFileSync(file, updated, "utf8");

  console.log("========================================");
  console.log("PATCH APLICADO COM SUCESSO");
  console.log("========================================");
  console.log(`Arquivo: ${file}`);
  console.log(`Tamanho anterior: ${source.length} caracteres`);
  console.log(`Tamanho novo:     ${updated.length} caracteres`);
  console.log(`Backup: ${backup}`);
  console.log("========================================");
}

try {
  applyPatch();
} catch (error) {
  fail(error?.message || String(error));
}
