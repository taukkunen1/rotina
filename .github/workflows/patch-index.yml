name: Patch index

on:
  workflow_dispatch:
    inputs:
      patch_old:
        description: "Texto exato a substituir"
        required: true
        type: string
      patch_new:
        description: "Texto novo"
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        env:
          PATCH_OLD: ${{ inputs.patch_old }}
          PATCH_NEW: ${{ inputs.patch_new }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old = os.environ["PATCH_OLD"]
          new = os.environ["PATCH_NEW"]

          count = text.count(old)

          if count != 1:
              raise SystemExit(
                  f"PATCH_OLD deve aparecer exatamente 1 vez; encontrado: {count}"
              )

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Patch aplicado com sucesso.")
          PY

      - name: Validate HTML
        run: |
          test -s index.html
          echo "index.html válido."

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi

          git commit -m "chore: patch index"
          git push
