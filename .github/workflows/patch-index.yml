name: Patch index

on:
  workflow_dispatch:
    inputs:
      patch_old:
        description: "Texto exato a substituir"
        required: true
        type: string
      patch_new:
        description: "Texto novo"
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        env:
          PATCH_OLD: ${{ inputs.patch_old }}
          PATCH_NEW: ${{ inputs.patch_new }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("index.html")

          if not path.exists():
              raise SystemExit("ERRO: index.html não encontrado.")

          text = path.read_text(encoding="utf-8")

          old = os.environ["PATCH_OLD"]
          new = os.environ["PATCH_NEW"]

          if not old:
              raise SystemExit("ERRO: PATCH_OLD está vazio.")

          count = text.count(old)

          if count != 1:
              raise SystemExit(
                  f"ERRO: PATCH_OLD deve aparecer exatamente 1 vez; "
                  f"encontrado: {count}"
              )

          updated = text.replace(old, new, 1)

          path.write_text(updated, encoding="utf-8")

          print("OK: patch aplicado com sucesso.")
          PY

      - name: Validate index.html
        run: |
          test -s index.html
          echo "OK: index.html existe e não está vazio."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração detectada."
            exit 0
          fi

          git commit -m "chore: patch index"
          git push
