name: Patch index

on:
  workflow_dispatch:
    inputs:
      patch_old:
        description: "Variável CSS ou texto a substituir"
        required: true
        type: string
      patch_new:
        description: "Novo valor"
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        env:
          PATCH_OLD: ${{ inputs.patch_old }}
          PATCH_NEW: ${{ inputs.patch_new }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("index.html")

          if not path.exists():
              raise SystemExit("ERRO: index.html não encontrado.")

          text = path.read_text(encoding="utf-8")

          old = os.environ["PATCH_OLD"].strip()
          new = os.environ["PATCH_NEW"].strip()

          if not old:
              raise SystemExit("ERRO: PATCH_OLD está vazio.")

          if not new:
              raise SystemExit("ERRO: PATCH_NEW está vazio.")

          # Caso seja uma variável CSS, por exemplo:
          # --board:#16241f;
          # --green:#b7ddba;
          #
          # A indentação e os espaços são ignorados.
          css_match = re.fullmatch(
              r'(--[a-zA-Z0-9_-]+)\s*:\s*(.+?)\s*;',
              old
          )

          if css_match:
              variable = css_match.group(1)
              old_value = css_match.group(2).strip()

              new_match = re.fullmatch(
                  rf'{re.escape(variable)}\s*:\s*(.+?)\s*;',
                  new
              )

              if not new_match:
                  raise SystemExit(
                      f"ERRO: PATCH_NEW não corresponde à variável {variable}."
                  )

              new_value = new_match.group(1).strip()

              pattern = re.compile(
                  rf'(?P<indent>[ \t]*)'
                  rf'{re.escape(variable)}'
                  rf'\s*:\s*'
                  rf'{re.escape(old_value)}'
                  rf'\s*;',
                  re.MULTILINE
              )

              matches = list(pattern.finditer(text))

              if len(matches) != 1:
                  raise SystemExit(
                      f"ERRO: variável {variable} com valor "
                      f"{old_value} deve aparecer exatamente 1 vez; "
                      f"encontrado: {len(matches)}"
                  )

              indent = matches[0].group("indent")

              replacement = (
                  f"{indent}{variable}:{new_value};"
              )

              text = (
                  text[:matches[0].start()]
                  + replacement
                  + text[matches[0].end():]
              )

              print(
                  f"OK: {variable} alterado de "
                  f"{old_value} para {new_value}."
              )

          else:
              # Fallback para substituições literais.
              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"ERRO: PATCH_OLD deve aparecer exatamente 1 vez; "
                      f"encontrado: {count}"
                  )

              text = text.replace(old, new, 1)

              print("OK: substituição literal aplicada.")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate index.html
        run: |
          test -s index.html
          echo "OK: index.html existe e não está vazio."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração detectada."
            exit 0
          fi

          git commit -m "chore: patch index"
          git push
