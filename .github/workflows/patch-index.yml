name: Patch index

on:
  workflow_dispatch:
    inputs:
      css_variable:
        description: "Variável CSS, por exemplo --board-edge"
        required: true
        type: string
      new_value:
        description: "Novo valor, por exemplo #07101d"
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply CSS patch
        env:
          CSS_VARIABLE: ${{ inputs.css_variable }}
          NEW_VALUE: ${{ inputs.new_value }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("index.html")

          if not path.exists():
              raise SystemExit("ERRO: index.html não encontrado.")

          text = path.read_text(encoding="utf-8")

          variable = os.environ["CSS_VARIABLE"].strip()
          new_value = os.environ["NEW_VALUE"].strip()

          if not re.fullmatch(r'--[A-Za-z0-9_-]+', variable):
              raise SystemExit(
                  f"ERRO: variável CSS inválida: {variable}"
              )

          if not new_value:
              raise SystemExit("ERRO: novo valor está vazio.")

          pattern = re.compile(
              rf'(?P<indent>[ \t]*)'
              rf'{re.escape(variable)}'
              rf'\s*:\s*'
              rf'[^;]+'
              rf'\s*;',
              re.MULTILINE
          )

          matches = list(pattern.finditer(text))

          if len(matches) != 1:
              raise SystemExit(
                  f"ERRO: variável {variable} deve aparecer "
                  f"exatamente 1 vez; encontrado: {len(matches)}"
              )

          match = matches[0]
          indent = match.group("indent")

          replacement = f"{indent}{variable}:{new_value};"

          updated = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          path.write_text(updated, encoding="utf-8")

          print(
              f"OK: {variable} alterado para {new_value}."
          )
          PY

      - name: Validate index.html
        run: |
          test -s index.html
          echo "OK: index.html existe e não está vazio."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração detectada."
            exit 0
          fi

          git commit -m "chore: update CSS variable"
          git push
