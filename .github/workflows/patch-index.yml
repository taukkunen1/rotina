name: Patch index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply complete color palette
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          palette = {
              "--board": "#0b1220",
              "--board-edge": "#07101d",
              "--chalk": "#f5f7fb",
              "--chalk-dim": "#aeb9c9",
              "--yellow": "#ffc857",
              "--pink": "#ff718c",
              "--blue": "#54c7e8",
              "--orange": "#ff9566",
              "--green": "#48d7a0",
              "--red": "#ff6472",
              "--wood": "#34445f",
              "--wood-dark": "#202c42",
              "--line": "rgba(226,235,248,.16)",
              "--focus": "#7de3ff",
          }

          for variable, new_value in palette.items():

              pattern = re.compile(
                  rf'(?P<indent>[ \t]*)'
                  rf'{re.escape(variable)}'
                  rf'\s*:\s*'
                  rf'[^;]+'
                  rf'\s*;',
                  re.MULTILINE
              )

              matches = list(pattern.finditer(text))

              if len(matches) != 1:
                  raise SystemExit(
                      f"ERRO: {variable} deve aparecer "
                      f"exatamente 1 vez; encontrado: {len(matches)}"
                  )

              match = matches[0]
              indent = match.group("indent")

              replacement = f"{indent}{variable}:{new_value};"

              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

              print(f"OK: {variable} = {new_value}")

          path.write_text(text, encoding="utf-8")

          print("")
          print("PALETA COMPLETA APLICADA COM SUCESSO.")
          PY

      - name: Validate index.html
        run: |
          test -s index.html
          echo "OK: index.html válido."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi

          git commit -m "style: apply complete UI color palette"
          git push
