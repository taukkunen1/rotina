name: Add autonomy tools

on:
  push:
    branches: [main]
    paths:
      - ai-chunks/autonomy-tools-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add courage ladder and independent mission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* ===================== AUTONOMIA E CORAGEM ===================== */'
          if marker in text:
              print('Autonomy tools already installed.')
              raise SystemExit(0)
          code = r'''
/* ===================== AUTONOMIA E CORAGEM ===================== */
function ensureAutonomyState(){
  if(!state.autonomy || typeof state.autonomy !== 'object') state.autonomy = {};
  if(!Number.isInteger(state.autonomy.courageLevel)) state.autonomy.courageLevel = 0;
  if(!state.autonomy.daily || typeof state.autonomy.daily !== 'object') state.autonomy.daily = {};
  const iso = todayISO();
  if(!state.autonomy.daily[iso] || typeof state.autonomy.daily[iso] !== 'object'){
    state.autonomy.daily[iso] = { courageTried:false, missionStatus:null };
  }
  return state.autonomy.daily[iso];
}

function independentMissionForToday(){
  const missions = [
    'Preparar a mochila e conferir o que precisa para amanhã.',
    'Escolher e separar a roupa do próximo dia.',
    'Organizar sozinho o material que usou hoje.',
    'Arrumar o próprio espaço por 10 minutos, sem lembretes durante a missão.',
    'Preparar um lanche simples e seguro, seguindo as regras combinadas.',
    'Seguir a sequência do banho usando apenas o checklist.',
    'Resolver uma pequena pendência da rotina antes de pedir ajuda.'
  ];
  const iso = todayISO();
  const n = Number(iso.replace(/-/g,''));
  return missions[n % missions.length];
}

function renderAutonomyCards(){
  ensureAutonomyState();
  let el = document.getElementById('autonomyCards');
  if(!el){
    el = document.createElement('section');
    el.id = 'autonomyCards';
    el.className = 'autonomy-cards';
    const content = document.querySelector('.content');
    if(!content) return;
    const anchor = document.getElementById('periods') || document.querySelector('.periods') || content.firstElementChild;
    if(anchor) content.insertBefore(el, anchor); else content.prepend(el);
  }
  const daily = state.autonomy.daily[todayISO()];
  const courageSteps = [
    'Escolher uma coisa simples para fazer sem alguém começar por mim.',
    'Fazer uma pergunta ou pedido sozinho quando normalmente chamaria um adulto para falar.',
    'Tentar resolver um pequeno problema antes de pedir ajuda.',
    'Fazer uma atividade que dá um pouco de receio, usando um plano combinado.',
    'Enfrentar um desafio que eu normalmente evitaria, passo a passo.'
  ];
  const level = Math.max(0, Math.min(courageSteps.length-1, state.autonomy.courageLevel));
  const status = daily.missionStatus;
  el.innerHTML = `
    <div class="autonomy-card courage-card">
      <div class="autonomy-kicker">🦁 ESCADA DA CORAGEM</div>
      <div class="autonomy-title">Degrau ${level+1} de ${courageSteps.length}</div>
      <div class="autonomy-text">${courageSteps[level]}</div>
      <div class="autonomy-actions">
        <button class="autonomy-btn ${daily.courageTried?'active':''}" id="courageTryBtn">${daily.courageTried?'✓ Pratiquei hoje':'Vou praticar hoje'}</button>
        <button class="autonomy-btn ghost" id="courageNextBtn" ${level===courageSteps.length-1?'disabled':''}>Próximo degrau →</button>
      </div>
      <div class="autonomy-note">Coragem não é ficar sem medo. É tentar mesmo quando existe um pouco de medo.</div>
    </div>
    <div class="autonomy-card mission-card">
      <div class="autonomy-kicker">🦅 MISSÃO INDEPENDENTE</div>
      <div class="autonomy-title">Missão de hoje</div>
      <div class="autonomy-text">${independentMissionForToday()}</div>
      <div class="autonomy-actions">
        <button class="autonomy-btn ${status==='alone'?'active':''}" id="missionAloneBtn">✓ Consegui sozinho</button>
        <button class="autonomy-btn help ${status==='help'?'active':''}" id="missionHelpBtn">🤝 Precisei de ajuda</button>
      </div>
      <div class="autonomy-note">Precisar de ajuda não é fracasso. Registrar como foi ajuda a perceber o progresso com o tempo.</div>
    </div>`;
  document.getElementById('courageTryBtn').onclick = ()=>{
    const d = ensureAutonomyState();
    d.courageTried = !d.courageTried;
    saveState(state);
    renderAutonomyCards();
  };
  document.getElementById('courageNextBtn').onclick = ()=>{
    state.autonomy.courageLevel = Math.min(courageSteps.length-1, state.autonomy.courageLevel + 1);
    saveState(state);
    renderAutonomyCards();
  };
  document.getElementById('missionAloneBtn').onclick = ()=>{
    const d = ensureAutonomyState();
    d.missionStatus = d.missionStatus === 'alone' ? null : 'alone';
    saveState(state);
    renderAutonomyCards();
  };
  document.getElementById('missionHelpBtn').onclick = ()=>{
    const d = ensureAutonomyState();
    d.missionStatus = d.missionStatus === 'help' ? null : 'help';
    saveState(state);
    renderAutonomyCards();
  };
}
'''
          css = r'''

  .autonomy-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 16px;}
  .autonomy-card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .courage-card{border-color:rgba(255,217,61,.34);background:rgba(255,217,61,.055);}
  .mission-card{border-color:rgba(79,195,247,.34);background:rgba(79,195,247,.045);}
  .autonomy-kicker{font-size:.68rem;letter-spacing:1px;color:var(--chalk-dim);margin-bottom:5px;}
  .autonomy-title{font-family:"Segoe Print","Bradley Hand",cursive;font-size:1rem;color:var(--chalk);margin-bottom:7px;}
  .autonomy-text{font-size:.86rem;line-height:1.45;min-height:48px;}
  .autonomy-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;}
  .autonomy-btn{font-family:inherit;font-size:.78rem;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,217,61,.45);background:rgba(255,217,61,.11);color:var(--yellow);cursor:pointer;}
  .autonomy-btn.active{background:var(--green);border-color:var(--green);color:#132015;font-weight:bold;}
  .autonomy-btn.ghost{border-color:var(--line);background:transparent;color:var(--chalk-dim);}
  .autonomy-btn.help{border-color:rgba(79,195,247,.45);background:rgba(79,195,247,.08);color:var(--blue);}
  .autonomy-btn:disabled{opacity:.4;cursor:default;}
  .autonomy-note{font-size:.68rem;color:var(--chalk-dim);line-height:1.4;margin-top:10px;}
  @media(max-width:720px){.autonomy-cards{grid-template-columns:1fr;}}
'''
          # Add CSS immediately before the closing style tag.
          style_anchor = '</style>'
          text = text.replace(style_anchor, css + '\n' + style_anchor, 1)
          # Add functions before main render section.
          js_anchor = '/* ---------------- render principal ---------------- */'
          if js_anchor not in text:
              raise SystemExit('JS anchor not found')
          text = text.replace(js_anchor, code + '\n' + js_anchor, 1)
          # Render on every main render cycle.
          render_anchor = '  renderFocusCard();\n  renderFreshStartArea();'
          if render_anchor not in text:
              raise SystemExit('Render anchor not found')
          text = text.replace(render_anchor, '  renderAutonomyCards();\n' + render_anchor, 1)
          p.write_text(text, encoding='utf-8')
          print('Autonomy tools installed.')
          PY
      - name: Validate
        run: |
          test -s index.html
          grep -q 'AUTONOMIA E CORAGEM' index.html
          grep -q 'renderAutonomyCards' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add courage ladder and independent mission"
          git push
