name: Validate site before publish

on:
  push:
    branches: [main]
    paths: ['index.html','adultos.html','historico.html','*.js','*.css','.github/workflows/validate-site.yml']
  pull_request:
    paths: ['index.html','adultos.html','historico.html','*.js','*.css']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML structure
        shell: python
        run: |
          from pathlib import Path
          import re
          for filename in ('index.html','adultos.html','historico.html'):
              html=Path(filename).read_text(encoding='utf-8')
              if not html.lstrip().lower().startswith('<!doctype html>'): raise SystemExit(f'{filename}: missing doctype')
              for tag in ('html','head','body'):
                  if len(re.findall(fr'<{tag}(?:\s|>)',html,re.I)) != len(re.findall(fr'</{tag}>',html,re.I)): raise SystemExit(f'{filename}: unbalanced {tag}')
              if len(re.findall(r'<script\b',html,re.I)) != len(re.findall(r'</script>',html,re.I)): raise SystemExit(f'{filename}: unbalanced scripts')
              if len(re.findall(r'<style\b',html,re.I)) != len(re.findall(r'</style>',html,re.I)): raise SystemExit(f'{filename}: unbalanced styles')
              if '\\\\n<script>' in html or 'Rotina do rotina' in html: raise SystemExit(f'{filename}: forbidden artifact')
          print('HTML: OK')
      - name: Validate JavaScript syntax
        run: |
          for file in storage.js autonomy.js app-ui.js adults.js history.js; do node --check "$file"; done
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for filename in ('index.html','adultos.html','historico.html'):
              html=Path(filename).read_text(encoding='utf-8')
              for i,block in enumerate(re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,re.S|re.I)):
                  if not block.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f: f.write(block); name=f.name
                  r=subprocess.run(['node','--check',name],capture_output=True,text=True)
                  if r.returncode: print(r.stderr); raise SystemExit(f'{filename}: inline script {i} invalid')
          print('JavaScript: OK')
          PY
      - name: Validate required modules
        shell: python
        run: |
          from pathlib import Path
          required=['styles.css','storage.js','autonomy.js','app-ui.js','ui.css','adults.js','history.js']
          missing=[p for p in required if not Path(p).is_file()]
          if missing: raise SystemExit('Missing modules: '+', '.join(missing))
          print('Modules: OK')
